packages:
  - cdk
  - cloud-tests
  - services/*

strictPeerDependencies: true
saveExact: true
engineStrict: true

allowBuilds:
  '@aws/agentcore': false
  esbuild: false
  protobufjs: false

peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-react>eslint: '10'

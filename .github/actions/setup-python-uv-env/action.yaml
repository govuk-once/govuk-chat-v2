name: "Set up a Python UV environment"
description: "Installs uv and sets up Python"
inputs:
  dependencies_github_token:
     required: true
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7.1.0

    - name: Set up Python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version-file: ".python-version"

    - name: Register GitHub PAT for private repos
      shell: bash
      run: echo "${{ inputs.dependencies_github_token }}" | gh auth login --with-token

    - name: Configure the Git credential helper
      shell: bash
      run: gh auth setup-git

    - name: Install dependencies
      shell: bash
      run: uv sync --all-packages --locked --dev

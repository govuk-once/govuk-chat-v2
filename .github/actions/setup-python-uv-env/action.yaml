name: 'Set up a Python UV environment'
description: 'Installs uv and sets up Python'
inputs:
  private_repo_app_client_id:
    required: true
  private_repo_app_private_key:
    required: true
runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7.1.0

    - name: Set up Python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version-file: '.python-version'

    - name: Create private repo token
      id: private-repo-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.private_repo_app_client_id }}
        private-key: ${{ inputs.private_repo_app_private_key }}
        owner: govuk-once
        repositories: govuk-chat-v2-private
        permission-contents: read

    - name: Configure Git for Private Repos
      shell: bash
      run: |
        git config --global url."https://x-access-token:${{ steps.private-repo-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

    - name: Install dependencies
      shell: bash
      run: uv sync --all-packages --frozen --dev

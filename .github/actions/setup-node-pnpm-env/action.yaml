name: 'Set up a Node PNPM environment'
description: 'Install PNPM, Node and dependencies'
runs:
  using: 'composite'
  steps:
    - name: Get PNPM Version
      id: pnpm-version
      shell: bash
      run: echo "pnpm_version=$(jq -r '.packageManager' package.json)" >> $GITHUB_OUTPUT

    - name: Install PNPM
      shell: bash
      run: npm install -g ${{ steps.pnpm-version.outputs.pnpm_version }}

    - name: Install Node
      uses: actions/setup-node@v6.2.0
      with:
        cache: 'pnpm'
        node-version-file: '.nvmrc'

    - name: Install PNPM dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

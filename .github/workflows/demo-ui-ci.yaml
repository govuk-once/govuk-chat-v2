name: Demo UI CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/actions/setup-node-pnpm-env/*'
      - '.github/workflows/demo-ui-ci.yaml'
      - '.nvmrc'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'services/demo-ui/**'
  pull_request:
    paths:
      - '.github/actions/setup-node-pnpm-env/*'
      - '.github/workflows/demo-ui-ci.yaml'
      - '.nvmrc'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'services/demo-ui/**'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-node-pnpm-env

      - name: Run tests
        run: services/demo-ui/scripts/test.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-node-pnpm-env

      - name: Run linter
        run: services/demo-ui/scripts/lint.sh

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-node-pnpm-env

      - name: Run formatter
        run: services/demo-ui/scripts/format.sh

  typing:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-node-pnpm-env

      - name: Run type checks
        run: services/demo-ui/scripts/type-check.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-node-pnpm-env

      - name: Run build
        run: services/demo-ui/scripts/build.sh

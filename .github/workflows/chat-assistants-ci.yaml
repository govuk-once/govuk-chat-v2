name: Chat Assistants CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-python-uv-env/*"
      - ".github/workflows/chat-assistants-ci.yaml"
      - "uv.lock"
      - "libs/python/chat-assistants/**"
  pull_request:
    paths:
      - ".github/actions/setup-python-uv-env/*"
      - ".github/workflows/chat-assistants-ci.yaml"
      - "uv.lock"
      - "libs/python/chat-assistants/**"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-python-uv-env
        with:
          dependencies_github_token: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}

      - name: Run tests
        run: libs/python/chat-assistants/scripts/test.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-python-uv-env
        with:
          dependencies_github_token: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}

      - name: Run linter
        run: libs/python/chat-assistants/scripts/lint.sh

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-python-uv-env
        with:
          dependencies_github_token: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}

      - name: Run formatter
        run: libs/python/chat-assistants/scripts/format.sh

  typing:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-python-uv-env
        with:
          dependencies_github_token: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}

      - name: Run type checks
        run: libs/python/chat-assistants/scripts/type-check.sh

# Throwaway experiment, not for merging: checks that this repository's
# pull_request workflows can assume the dev account's GitHubDeploymentRole
# through GitHub OIDC.
name: OIDC experiment

on:
  pull_request:
    paths:
      - '.github/workflows/oidc-experiment.yaml'

permissions:
  contents: read
  id-token: write

jobs:
  assume-role:
    name: Assume the dev deploy role
    runs-on: ubuntu-latest
    steps:
      - name: Show the OIDC subject claim
        run: |
          token=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r .sub || true

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::207513914339:role/GitHubDeploymentRole
          aws-region: eu-west-2

      - name: Check the assumed identity
        run: aws sts get-caller-identity

      - name: Check read access
        run: aws cloudformation list-stacks --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE --query 'length(StackSummaries)'

name: Format Non-Projects CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - 'services/**'
      - 'libs/**'
      - 'utilities/**'
      - 'cdk/**'
      - 'cloud-tests/**'
  pull_request:
    paths-ignore:
      - 'services/**'
      - 'libs/**'
      - 'utilities/**'
      - 'cdk/**'
      - 'cloud-tests/**'

jobs:
  prettier_format:
    name: Prettier formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup-node-pnpm-env

      - name: Run Prettier
        run: scripts/format-non-projects.sh

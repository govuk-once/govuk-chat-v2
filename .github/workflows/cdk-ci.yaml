name: CDK CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "cdk/**"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "cdk/**"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./.github/actions/setup-node-pnpm-env

      - name: Run tests
        run: cdk/scripts/test.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./.github/actions/setup-node-pnpm-env

      - name: Run linter
        run: cdk/scripts/lint.sh

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./.github/actions/setup-node-pnpm-env

      - name: Run formatter
        run: cdk/scripts/format.sh

  typing:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./.github/actions/setup-node-pnpm-env

      - name: Run type checks
        run: cdk/scripts/type-check.sh

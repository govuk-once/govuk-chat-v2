name: CDK CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/actions/setup-node-pnpm-env/*'
      - '.github/workflows/cdk-ci.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'cdk/**'
  pull_request:
    paths:
      - '.github/actions/setup-node-pnpm-env/*'
      - '.github/workflows/cdk-ci.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'cdk/**'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm-env

      - name: Run tests
        run: cdk/scripts/test.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm-env

      - name: Run linter
        run: cdk/scripts/lint.sh

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm-env

      - name: Run formatter
        run: cdk/scripts/format.sh

  typing:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm-env

      - name: Run type checks
        run: cdk/scripts/type-check.sh

  cdk-synth:
    name: CDK Synth
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm-env

      - name: Run CDK Synth
        run: cdk/scripts/cdk-synth.sh

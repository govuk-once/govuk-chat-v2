name: Chat API CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "services/chat-api/**"
  pull_request:
    paths:
      - "services/chat-api/**"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./.github/actions/setup-python-uv-env

      - name: Run tests
        run: services/chat-api/scripts/test.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./.github/actions/setup-python-uv-env

      - name: Run linter
        run: services/chat-api/scripts/lint.sh

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./.github/actions/setup-python-uv-env

      - name: Run formatter
        run: services/chat-api/scripts/format.sh

  typing:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: ./.github/actions/setup-python-uv-env

      - name: Run type checks
        run: services/chat-api/scripts/type-check.sh

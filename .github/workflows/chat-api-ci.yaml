name: Chat API CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-python-uv-env/*"
      - ".github/workflows/chat-api-ci.yaml"
      - "uv.lock"
      - "services/chat-api/**"
  pull_request:
    paths:
      - ".github/actions/setup-python-uv-env/*"
      - ".github/workflows/chat-api-ci.yaml"
      - "uv.lock"
      - "services/chat-api/**"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-python-uv-env

      - name: Run tests
        run: services/chat-api/scripts/test.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-python-uv-env

      - name: Run linter
        run: services/chat-api/scripts/lint.sh

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-python-uv-env

      - name: Run formatter
        run: services/chat-api/scripts/format.sh

  typing:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-python-uv-env

      - name: Run type checks
        run: services/chat-api/scripts/type-check.sh

name: Example Agent CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/actions/setup-python-uv-env/*'
      - '.github/actions/setup-node-pnpm-env/*'
      - '.github/workflows/example-agent-ci.yaml'
      - 'uv.lock'
      - 'pnpm-lock.yaml'
      - 'services/example-agent/**'
  pull_request:
    paths:
      - '.github/actions/setup-python-uv-env/*'
      - '.github/actions/setup-node-pnpm-env/*'
      - '.github/workflows/example-agent-ci.yaml'
      - 'uv.lock'
      - 'pnpm-lock.yaml'
      - 'services/example-agent/**'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-uv-env
        with:
          dependencies_github_token: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}

      - name: Run tests
        run: services/example-agent/scripts/test.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-uv-env
        with:
          dependencies_github_token: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}

      - name: Run linter
        run: services/example-agent/scripts/lint.sh

  ruff_format:
    name: Ruff formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-uv-env
        with:
          dependencies_github_token: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}

      - name: Run formatter
        run: services/example-agent/scripts/format-ruff.sh

  prettier_format:
    name: Prettier formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-pnpm-env

      - name: Run Prettier
        run: services/example-agent/scripts/format-prettier.sh

  typing:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-uv-env
        with:
          dependencies_github_token: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}

      - name: Run type checks
        run: services/example-agent/scripts/type-check.sh

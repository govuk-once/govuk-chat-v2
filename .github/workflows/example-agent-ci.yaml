name: Example Agent CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-python-uv-env/*"
      - ".github/workflows/example-agent-ci.yaml"
      - "uv.lock"
      - "services/example-agent/**"
  pull_request:
    paths:
      - ".github/actions/setup-python-uv-env/*"
      - ".github/workflows/example-agent-ci.yaml"
      - "uv.lock"
      - "services/example-agent/**"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-python-uv-env
        with:
          dependencies_github_token: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}

      - name: Run tests
        run: services/example-agent/scripts/test.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-python-uv-env
        with:
          dependencies_github_token: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}

      - name: Run linter
        run: services/example-agent/scripts/lint.sh

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-python-uv-env
        with:
          dependencies_github_token: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}

      - name: Run formatter
        run: services/example-agent/scripts/format.sh

  typing:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-python-uv-env
        with:
          dependencies_github_token: ${{ secrets.PRIVATE_REPO_ACCESS_GITHUB_TOKEN }}

      - name: Run type checks
        run: services/example-agent/scripts/type-check.sh

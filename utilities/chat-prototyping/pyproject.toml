[project]
name = "chat-prototyping"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
dependencies = [
    "chat-assistants",
    "gradio>=6.20.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "respx>=0.22.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]

[project]
name = "agui-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.9"
dependencies = [
    "ag-ui-strands >= 1.0.2",
    "ag-ui-protocol >= 1.0.0",
    "aws-opentelemetry-distro >= 0.22.0",
    "bedrock-agentcore >= 1.25.3",
    "govuk-chat-v2-private",
    "strands-agents >= 1.64.0",
    "strands-agents-tools >= 0.9.0",
]

[dependency-groups]
dev = [
    "agentcore-cli-wrapper",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-mock>=3.17.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]

[tool.uv.sources]
govuk-chat-v2-private = { git = "https://github.com/govuk-once/govuk-chat-v2-private.git" }

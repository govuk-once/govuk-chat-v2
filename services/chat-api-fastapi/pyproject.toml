[project]
name = "chat-api-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
dependencies = [
    "agent-runtime-types",
    "boto3>=1.43.39",
    "chat-assistants",
    "fastapi[standard]>=0.139.0",
    "pynamodb>=6.1.0",
    "sse-starlette>=3.4.5",
]

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb]>=1.43.49",
    "httpx>=0.28.1",
    "moto>=5.1.22",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]

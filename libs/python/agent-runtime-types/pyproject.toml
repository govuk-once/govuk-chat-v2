[project]
name = "agent-runtime-types"
version = "0.1.0"
description = "Shared type definitions for the agent runtime streaming protocol"
readme = "README.md"
dependencies = [
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.15.20",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
